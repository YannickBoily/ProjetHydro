name: Hydro Weekly Maintenance

on:
  schedule:
    - cron: "20 5 * * 0"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sync municipality reference
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
          SUPABASE_SYNC_RAW: "0"
          SUPABASE_SYNC_MUNICIPALITIES: "1"
        run: python scripts/sync_to_supabase.py

      - name: Reconcile analytical tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
          SUPABASE_FORCE_LATEST_REBUILD: "1"
          SUPABASE_FORCE_HEAVY_REFRESH: "1"
        run: python scripts/refresh_supabase_analytics.py
