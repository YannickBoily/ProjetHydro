name: Update Hydro Outages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydro-production
  cancel-in-progress: false

jobs:
  update_outages:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare raw data directory
        run: mkdir -p data/raw

      - name: Fetch current outage snapshot
        env:
          # Supabase is the production history store. Avoid rewriting the
          # complete local CSV on every hourly GitHub Actions run.
          HYDRO_WRITE_LOCAL_HISTORY: "0"
        run: python scripts/fetch_outages.py

      - name: Archive raw snapshot
        run: python scripts/archive_snapshot.py

      - name: Upload raw snapshot backup
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hydro-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/archive/**
          if-no-files-found: error
          retention-days: 30

      - name: Sync current snapshot to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
          SUPABASE_SYNC_LOOKBACK_HOURS: "2"
          SUPABASE_SYNC_MUNICIPALITIES: "0"
        run: python scripts/sync_to_supabase.py

      - name: Incrementally refresh Supabase analytics
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
        run: python scripts/refresh_supabase_analytics.py

      - name: Check pipeline health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
        run: python scripts/check_pipeline_health.py
