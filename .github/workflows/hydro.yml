name: Update Hydro Outages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update_outages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw outage data
        run: python scripts/fetch_outages.py

      - name: Build DuckDB warehouse with SQL
        run: python scripts/build_warehouse.py

      - name: Export processed analytical tables
        run: python scripts/export_tables.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/hydroquebec_history.csv
          git add data/processed/latest_outages.csv
          git add data/processed/active_outages.csv
          git add data/processed/daily_summary.csv
          git add data/processed/data_quality_report.csv
          git add sql/
          git add scripts/
          git commit -m "Update outage data pipeline outputs" || echo "No changes to commit"
          git push