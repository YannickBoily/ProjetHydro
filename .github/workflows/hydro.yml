name: Update Hydro Outages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update_outages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare raw data directory
        run: mkdir -p data/raw

      - name: Fetch current outage data
        run: python scripts/fetch_outages.py

      - name: Sync outage data to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
        run: python scripts/sync_to_supabase.py

      - name: Refresh Supabase analytical tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOSTADDR: ${{ secrets.SUPABASE_DB_HOSTADDR }}
        run: python scripts/refresh_supabase_analytics.py
