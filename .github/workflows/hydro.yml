name: Update Hydro Outages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update_outages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch outage data
        run: python scripts/fetch_outages.py

      - name: Commit updated raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/hydroquebec_history.csv
          git commit -m "Update raw outage history" || echo "No changes to commit"
          git push
